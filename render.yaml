services:
  - type: web
    name: ota-habit-coach
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: STUDENT_LINK_CODE
        sync: false
      - key: COACH_LINK_CODE
        sync: false
      - key: COACH_LINE_USER_ID
        sync: false
      - key: REPORT_EMAIL_TO
        sync: false
      - key: GOOGLE_SCRIPT_EMAIL_WEBHOOK_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
